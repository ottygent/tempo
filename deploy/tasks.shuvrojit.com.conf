<VirtualHost *:80>
    ServerName tasks.shuvrojit.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8085/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:8085/
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/tasks.shuvrojit.com-error.log
    CustomLog ${APACHE_LOG_DIR}/tasks.shuvrojit.com-access.log combined
</VirtualHost>
